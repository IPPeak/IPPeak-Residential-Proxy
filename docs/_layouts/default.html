<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
{{ page.title }} | {{ site.title }}
</title>


<meta name="description" content="{{ site.description }}">


<style>

* {
    box-sizing: border-box;
}


body {

    margin:0;

    font-family:

    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;

    color:#24292f;

    background:#ffffff;

    line-height:1.6;

}



/* Header */

header {

    background:#111827;

    color:white;

    padding:24px 40px;

}



header h1 {

    margin:0;

    font-size:26px;

}



/* Navigation */

nav {

    margin-top:15px;

}


nav a {

    color:#ffffff;

    text-decoration:none;

    margin-right:25px;

    font-size:15px;

}


nav a:hover {

    text-decoration:underline;

}



/* Main */

.container {

    max-width:1000px;

    margin:auto;

    padding:40px 25px;

}



/* Markdown */

h1 {

    font-size:36px;

    margin-bottom:20px;

}


h2 {

    margin-top:45px;

}


h3 {

    margin-top:30px;

}



a {

    color:#0969da;

}



code {

    background:#f6f8fa;

    padding:3px 6px;

    border-radius:5px;

}



pre {

    background:#0d1117;

    color:#ffffff;

    padding:20px;

    border-radius:8px;

    overflow-x:auto;

}



pre code {

    background:none;

    padding:0;

}



blockquote {

    border-left:4px solid #d0d7de;

    padding-left:20px;

    color:#57606a;

}



/* Footer */

footer {

    margin-top:60px;

    padding:30px;

    text-align:center;

    border-top:1px solid #e5e7eb;

    color:#6b7280;

}



/* Mobile */

@media(max-width:700px){

    header {

        padding:20px;

    }


    nav a {

        display:block;

        margin-bottom:10px;

    }


    .container {

        padding:25px 15px;

    }

}


</style>


</head>



<body>



<header>


<h1>

{{ site.title }}

</h1>



<nav>

<a href="{{ site.baseurl }}/">
Home
</a>


<a href="{{ site.baseurl }}/getting-started">
Getting Started
</a>


<a href="{{ site.baseurl }}/proxy-types">
Proxy Types
</a>


<a href="{{ site.baseurl }}/api">
API Reference
</a>


<a href="{{ site.baseurl }}/examples/python">
Examples
</a>


</nav>


</header>



<main class="container">


{{ content }}


</main>



<footer>


© IPPeak. All rights reserved.


</footer>



</body>


</html>
