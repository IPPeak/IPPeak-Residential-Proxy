<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>{{ page.title }} | {{ site.title }}</title>

  <meta name="description" content="{{ site.description }}">

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
      color: #24292f;
      background: #ffffff;
      line-height: 1.7;
    }

    a {
      color: #0969da;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .site-header {
      height: 64px;
      border-bottom: 1px solid #d8dee4;
      background: #ffffff;
      display: flex;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-inner {
      width: 100%;
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .site-title {
      font-size: 20px;
      font-weight: 700;
      color: #24292f;
    }

    .site-title:hover {
      text-decoration: none;
    }

    .header-nav {
      display: flex;
      gap: 24px;
      align-items: center;
    }

    .header-nav a {
      color: #57606a;
      font-size: 14px;
      font-weight: 500;
    }

    .header-nav a:hover {
      color: #0969da;
      text-decoration: none;
    }

    .docs-container {
      width: 100%;
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      min-height: calc(100vh - 64px);
    }

    .sidebar {
      width: 260px;
      flex-shrink: 0;
      border-right: 1px solid #d8dee4;
      padding: 32px 20px;
      position: sticky;
      top: 64px;
      height: calc(100vh - 64px);
      overflow-y: auto;
      background: #f6f8fa;
    }

    .sidebar-title {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      color: #57606a;
      margin-bottom: 12px;
      letter-spacing: 0.04em;
    }

    .sidebar-section {
      margin-bottom: 28px;
    }

    .sidebar a {
      display: block;
      padding: 7px 10px;
      margin: 2px 0;
      border-radius: 6px;
      color: #24292f;
      font-size: 14px;
    }

    .sidebar a:hover {
      background: #eaeef2;
      color: #0969da;
      text-decoration: none;
    }

    .sidebar a.active {
      background: #ddf4ff;
      color: #0969da;
      font-weight: 600;
    }

    .content {
      flex: 1;
      min-width: 0;
      padding: 48px 64px 80px;
    }

    .content-inner {
      max-width: 900px;
      margin: 0 auto;
    }

    .content h1 {
      font-size: 36px;
      line-height: 1.25;
      margin: 0 0 24px;
      color: #1f2328;
    }

    .content h2 {
      font-size: 26px;
      line-height: 1.3;
      margin-top: 48px;
      margin-bottom: 16px;
      color: #1f2328;
      padding-bottom: 8px;
      border-bottom: 1px solid #d8dee4;
    }

    .content h3 {
      font-size: 21px;
      margin-top: 32px;
      margin-bottom: 12px;
      color: #1f2328;
    }

    .content p {
      margin: 16px 0;
    }

    .content ul,
    .content ol {
      padding-left: 28px;
    }

    .content li {
      margin: 6px 0;
    }

    .content code {
      padding: 2px 6px;
      border-radius: 5px;
      background: #f6f8fa;
      border: 1px solid #d8dee4;
      font-family:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        Monaco,
        Consolas,
        "Liberation Mono",
        monospace;
      font-size: 0.9em;
    }

    .content pre {
      overflow-x: auto;
      padding: 18px;
      border-radius: 8px;
      background: #f6f8fa;
      border: 1px solid #d8dee4;
      margin: 24px 0;
    }

    .content pre code {
      padding: 0;
      border: 0;
      background: transparent;
      font-size: 14px;
    }

    .content blockquote {
      margin: 24px 0;
      padding: 12px 20px;
      border-left: 4px solid #0969da;
      background: #f6f8fa;
      color: #57606a;
    }

    .content table {
      width: 100%;
      border-collapse: collapse;
      margin: 24px 0;
    }

    .content th,
    .content td {
      border: 1px solid #d8dee4;
      padding: 10px 12px;
      text-align: left;
    }

    .content th {
      background: #f6f8fa;
      font-weight: 600;
    }

    .site-footer {
      border-top: 1px solid #d8dee4;
      padding: 24px 0;
      color: #57606a;
      font-size: 13px;
      text-align: center;
    }

    @media (max-width: 900px) {
      .header-inner {
        padding: 0 20px;
      }

      .header-nav {
        display: none;
      }

      .docs-container {
        display: block;
      }

      .sidebar {
        position: static;
        width: 100%;
        height: auto;
        border-right: 0;
        border-bottom: 1px solid #d8dee4;
        padding: 20px;
      }

      .content {
        padding: 32px 20px 60px;
      }

      .content h1 {
        font-size: 30px;
      }
    }
  </style>
</head>

<body>

<header class="site-header">
  <div class="header-inner">

    <a class="site-title" href="{{ '/' | relative_url }}">
      {{ site.title }}
    </a>

    <nav class="header-nav">
      <a href="{{ '/' | relative_url }}">Documentation</a>
      <a href="https://github.com/{{ site.github.repository_nwo }}">
        GitHub
      </a>
    </nav>

  </div>
</header>

<div class="docs-container">

  <aside class="sidebar">

    <div class="sidebar-section">
      <div class="sidebar-title">Documentation</div>

      <a href="{{ '/' | relative_url }}">
        Overview
      </a>

      <a href="{{ '/getting-started/' | relative_url }}">
        Getting Started
      </a>

      <a href="{{ '/proxy-types/' | relative_url }}">
        Proxy Types
      </a>

      <a href="{{ '/api/' | relative_url }}">
        API Reference
      </a>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-title">Examples</div>

      <a href="{{ '/examples/python/' | relative_url }}">
        Python
      </a>

      <a href="{{ '/examples/go/' | relative_url }}">
        Go
      </a>

      <a href="{{ '/examples/nodejs/' | relative_url }}">
        Node.js
      </a>
    </div>

  </aside>

  <main class="content">
    <div class="content-inner">

      {{ content }}

    </div>
  </main>

</div>

<footer class="site-footer">
  <div>
    {{ site.title }} · Technical Documentation
  </div>
</footer>

</body>
</html>
